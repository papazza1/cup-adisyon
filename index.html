<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C'up">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="C'up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<title>C'up</title>
<meta name="theme-color" content="#2F6FB3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: one-screen POS — top bar, scrolling view, bottom tab bar; tables as floor plan (tablet) or zone grid (phone); order sheet slides over */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#17223B; --muted:#5F6C84; --line:#D9E0E9;
  --accent:#2F6FB3; --accent-ink:#FFFFFF; --accent-soft:#DCE9F7;
  --warn:#B86E0C; --warn-soft:#FBEBD2; --bad:#C2413B; --bad-soft:#F8DEDC; --good:#2B8455; --good-soft:#DAF0E3;
  --wood:#EADFD2; --wood-line:#D5C4AF; --stone:#E1E5EA; --stone-line:#C8CED7;
  --shadow:0 1px 2px rgba(23,34,59,.08),0 4px 14px rgba(23,34,59,.06);
  --f-brand:"Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#182133; --surface2:#1E2940; --ink:#E7ECF5; --muted:#94A1B9; --line:#2A3650;
  --accent:#6AA7EA; --accent-ink:#0C1424; --accent-soft:#1E3352;
  --warn:#E8A84C; --warn-soft:#3A2D17; --bad:#EE7A72; --bad-soft:#3B1D1D; --good:#5CC28C; --good-soft:#173325;
  --wood:#2A2520; --wood-line:#41362C; --stone:#212935; --stone-line:#344052;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#182133; --surface2:#1E2940; --ink:#E7ECF5; --muted:#94A1B9; --line:#2A3650;
  --accent:#6AA7EA; --accent-ink:#0C1424; --accent-soft:#1E3352;
  --warn:#E8A84C; --warn-soft:#3A2D17; --bad:#EE7A72; --bad-soft:#3B1D1D; --good:#5CC28C; --good-soft:#173325;
  --wood:#2A2520; --wood-line:#41362C; --stone:#212935; --stone-line:#344052;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1400px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-brand);font-weight:600;font-size:22px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.brand .cloud{color:var(--accent)}
.brand small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.topbar .spacer{flex:1}
.today{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted)}
.today b{color:var(--ink);font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--warn)}
@media (max-width:480px){.hide-xs{display:none}.brand small{display:none}}
main{overflow-y:auto;padding:16px 16px 24px;min-height:0}
.view{display:flex;flex-direction:column;gap:16px}

.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}

.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h2{font-family:var(--f-brand);font-weight:600;font-size:19px;margin:0}
.muted{color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;background:var(--surface2);border:1px solid var(--line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Floor plan */
.plan{position:relative;width:100%;aspect-ratio:1254/553;max-width:100%;background:var(--surface2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.zone{position:absolute;border:1px solid var(--line)}
.zone.wood{background:var(--wood);background-image:repeating-linear-gradient(90deg,transparent 0 22px,var(--wood-line) 22px 23px)}
.zone.stone{background:var(--stone)}
.zone span{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.zone.bar span{left:8px}
.plan .tbl{position:absolute;transform:translate(-50%,-50%);width:7%;aspect-ratio:1/1;padding:2px}
.plan .tbl.round{width:5%;border-radius:50%}
.plan .tbl .nm{font-size:clamp(10px,1.15vw,15px)}
.plan .tbl .amt{font-size:clamp(9px,.95vw,13px)}
.plan .tbl .tm{font-size:clamp(8px,.8vw,11px)}
.tbl{background:var(--surface);border:1.5px solid var(--stone-line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;text-align:center;color:var(--ink);transition:transform .08s}
.tbl:active{transform:scale(.96)}
.plan .tbl:active{transform:translate(-50%,-50%) scale(.96)}
.tbl .nm{font-family:var(--f-brand);font-weight:600}
.tbl .amt{font-weight:700;font-variant-numeric:tabular-nums}
.tbl .tm{color:inherit;opacity:.8;font-variant-numeric:tabular-nums}
.tbl.open{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbl.long{background:var(--warn);border-color:var(--warn);color:#fff}
/* Zone grid */
.zones{display:flex;flex-direction:column;gap:18px}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:8px}
.zgrid .tbl{aspect-ratio:1/1;padding:6px;box-shadow:var(--shadow);border-color:var(--line)}
.zgrid .tbl.open,.zgrid .tbl.long{border-color:transparent}
.zgrid .tbl .nm{font-size:18px}
.zgrid .tbl .amt{font-size:14px}
.zgrid .tbl .tm{font-size:12px}
.zgrid .tbl.round{border-radius:50%}
.ztitle{display:flex;align-items:baseline;gap:8px}
.ztitle h3{margin:0;font-family:var(--f-brand);font-weight:600;font-size:16px}
.ztitle span{font-size:12px;color:var(--muted)}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-brand);font-weight:600;font-size:clamp(20px,3.2vw,28px);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.net .v.pos{color:var(--good)} .kpi.net .v.neg{color:var(--bad)}
.kpi.exp .v{color:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .r{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.cash{background:var(--good-soft);color:var(--good)}
.pill.card{background:var(--accent-soft);color:var(--accent)}
.pill.void{background:var(--bad-soft);color:var(--bad)}
.voided{opacity:.5;text-decoration:line-through}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.bill-lines{font-size:13px;color:var(--muted);padding:6px 0 2px 0}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.menu-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 110px 40px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.menu-row:first-of-type{border-top:0}
@media (max-width:560px){.menu-row{grid-template-columns:minmax(0,1fr) 92px 40px}.menu-row .catsel{grid-column:1/-1;order:3}}

/* Order sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head .t{font-family:var(--f-brand);font-weight:600;font-size:22px}
.sheet-head .z{font-size:13px;color:var(--muted)}
.sheet-body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);min-height:0}
.pane{min-height:0;display:flex;flex-direction:column}
.menu-pane{padding:12px 16px 0;gap:10px;overflow:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prods{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;align-content:start;padding-bottom:16px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:72px;position:relative}
.prod:active{background:var(--accent-soft)}
.prod .pn{font-weight:600;font-size:14px;line-height:1.2}
.prod .pp{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.prod .q{position:absolute;top:6px;right:6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.bill-pane{background:var(--surface);border-left:1px solid var(--line)}
.bill-scroll{flex:1;overflow-y:auto;padding:8px 16px}
.bl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bl:first-child{border-top:0}
.bl .bn{font-weight:600}
.bl .bu{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:9px;border:1px solid var(--line)}
.stepper button{width:34px;height:34px;font-size:18px;font-weight:700;display:grid;place-items:center}
.stepper span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.bl .lt{min-width:76px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bill-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-family:var(--f-brand);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums}
.phone-bar{display:none}
@media (max-width:760px){
  .sheet-body{grid-template-columns:1fr}
  .bill-pane{display:none;border-left:0}
  .sheet.show-bill .bill-pane{display:flex}
  .sheet.show-bill .menu-pane{display:none}
  .phone-bar{display:flex;gap:10px;align-items:center;padding:10px 0 12px;border-top:1px solid var(--line);background:var(--bg)}
  .phone-bar .btn{flex:1}
  .bill-back{display:inline-flex!important}
}
.bill-back{display:none!important}

/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,28,.45);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog h2{margin:0;font-family:var(--f-brand);font-weight:600;font-size:21px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{padding:12px 6px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;background:var(--surface2)}
.methods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sumrow{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sumrow.big{font-size:20px;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tpick button{padding:10px 4px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.tpick button.open{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* Vertical photo plan (portrait phones/tablets) */
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vrow .muted{font-size:13px}

.vplan .tbl{position:absolute;transform:translate(-50%,-50%);width:13%;aspect-ratio:1/1;padding:0;background:transparent;border:2px solid transparent;border-radius:6px;gap:0}
.vplan .tbl.round{width:11%;border-radius:50%}
.vplan .tbl:active{transform:translate(-50%,-50%) scale(.96);border-color:var(--accent)}
.vplan .tbl:not(.open):not(.long) > *{visibility:hidden}
.vplan .tbl.open,.vplan .tbl.long{box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 6px rgba(0,0,0,.35)}
.vplan .tbl.open{background:#2F6FB3;border-color:#2F6FB3;color:#fff}
.vplan .tbl.long{background:#C97A10;border-color:#C97A10;color:#fff}
.vplan .tbl .nm{font-size:4.2cqw}
.vplan .tbl .amt{font-size:3.3cqw}
.vplan .tbl .tm{font-size:2.6cqw}
main.tight{padding-block:8px}

.tbl{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body.is-dragging{cursor:grabbing}
body.is-dragging *{-webkit-user-select:none;user-select:none}
.tbl.dragging{opacity:.35}
.tbl.drop{outline:3px solid var(--good);outline-offset:3px}
.vplan .tbl.drop{background:rgba(43,132,85,.45);border-color:#fff}
.drag-ghost{position:fixed;z-index:70;transform:translate(-50%,-50%) scale(1.05);pointer-events:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.15;box-shadow:0 8px 24px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;font-size:13px}
.drag-ghost b{font-family:var(--f-brand);font-size:18px}
.drag-ghost.on{background:var(--good);color:#fff}

/* Admin PIN lock */
.lockbox{max-width:360px;margin:28px auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lockbox .lk{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lockbox h2{margin:0;font-family:var(--f-brand);font-weight:600;font-size:22px}
.lockbox p{margin:0;color:var(--muted);font-size:14px;max-width:32ch}
.pindots{display:flex;gap:14px;margin-top:4px}
.pindots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.pinmsg{min-height:20px;color:var(--bad);font-size:14px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.keypad button{height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--accent-soft)}
.keypad button.fn{font-size:15px;color:var(--muted);box-shadow:none;background:transparent;border-color:transparent}
.keypad button.ok{font-size:16px;color:var(--accent-ink);background:var(--accent);border-color:transparent}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dialog .lockbox{margin:4px auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(() => {
"use strict";
/* ---------- Floor plan (from the C'up plan drawing) ---------- */
const PW = 1254, PH = 553;
const ZONES = [

const GRID_ZONES = [["BAR","Bar"],["S","Salon"],["K","K Bölümü"],["T","Teras"],["B","Bahçe"]];
const TABLES = [
  ["BAR1","Bar 1","BAR",78,185,1],["BAR2","Bar 2","BAR",78,253,1],["BAR3","Bar 3","BAR",78,318,1],["BAR4","Bar 4","BAR",78,382,1],
  ["K1","K1","K",204,61],["K2","K2","K",381,61],["K3","K3","K",493,61],
  ["S1","S1","S",268,272],["S2","S2","S",268,423],["S3","S3","S",381,498],["S4","S4","S",381,198],["S5","S5","S",437,348],["S6","S6","S",493,198],["S7","S7","S",493,498],
  ["T1","T1","T",663,198],["T2","T2","T",663,498],["T3","T3","T",747,348],["T4","T4","T",747,103],["T5","T5","T",832,198],["T6","T6","T",832,498],

].map(([id,name,zone,x,y,round]) => ({id,name,zone,x,y,round:!!round}));
const TBY = Object.fromEntries(TABLES.map(t => [t.id,t]));
const ZNAME = Object.fromEntries(GRID_ZONES);
const EXP_CATS = ["Malzeme / Market","Personel","Kira","Elektrik / Su / Doğalgaz","Vergi / Muhasebe","Bakım / Onarım","Diğer"];
const LONG_MIN = 120;

/* ---------- Helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTL = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2,minimumFractionDigits:0});
const tl = n => fmtTL.format(Math.round((n||0)*100)/100);
const tlShort = n => { n = n||0; if (Math.abs(n) >= 100000) return "₺" + (n/1000).toLocaleString("tr-TR",{maximumFractionDigits:0}) + "B"; return tl(n); };
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const MSHORT = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const DAYS = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const longDate = d => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"][d.getDay()]}`;
const elapsed = ts => { const m = Math.max(0, Math.floor((Date.now()-ts)/60000)); return m < 60 ? `${m} dk` : `${Math.floor(m/60)} sa ${pad(m%60)}`; };
const linesTotal = lines => (lines||[]).reduce((s,l) => s + l.price*l.qty, 0);
const linesCount = lines => (lines||[]).reduce((s,l) => s + l.qty, 0);
const HOLDER = "dev-" + uid();

let toastTimer;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2400); }

/* ---------- State ---------- */
const st = {
  db: null, live: false,
  menu: {cats:[], items:[]},
  settings: {dayStartHour: 0},
  tables: {},          // tid -> {lines:[], openedAt}
  today: null,         // raw day doc for current business day
  tab: "tables",
  planMode: null,
  openTid: null, cat: "Tümü", q: "",
  rep: {mode:"day", anchor: null},
  expDate: null,
  lock: null, unlockedUntil: 0,
};
const bizDate = (ts = Date.now()) => ymd(new Date(ts - (st.settings.dayStartHour||0)*3600e3));

/* ---------- Store backends ---------- */
const DEMO_MENU = {cats:["Sıcak","Soğuk","Tatlı","Yiyecek"], items:[
  {id:"d1",name:"Türk Kahvesi",cat:"Sıcak",price:90},{id:"d2",name:"Çay",cat:"Sıcak",price:25},{id:"d3",name:"Latte",cat:"Sıcak",price:130},
  {id:"d4",name:"Ice Latte",cat:"Soğuk",price:140},{id:"d5",name:"Limonata",cat:"Soğuk",price:110},{id:"d6",name:"Cheesecake",cat:"Tatlı",price:180},{id:"d7",name:"Tost",cat:"Yiyecek",price:150}]};

/* Standalone (Mac / any browser): data persists in this browser's localStorage.
   SEED = starting menu; used only on first run. */
const SEED = {"config/menu": {"cats": ["Sıcak", "Soğuk", "Tatlı", "Yiyecek"], "items": [{"cat": "Sıcak", "id": "m01", "name": "Türk Kahvesi", "price": 90}, {"cat": "Sıcak", "id": "m02", "name": "Çay", "price": 25}, {"cat": "Sıcak", "id": "m03", "name": "Espresso", "price": 90}, {"cat": "Sıcak", "id": "m04", "name": "Americano", "price": 110}, {"cat": "Sıcak", "id": "m05", "name": "Latte", "price": 130}, {"cat": "Sıcak", "id": "m06", "name": "Cappuccino", "price": 130}, {"cat": "Sıcak", "id": "m07", "name": "Filtre Kahve", "price": 110}, {"cat": "Sıcak", "id": "m08", "name": "Sıcak Çikolata", "price": 130}, {"cat": "Soğuk", "id": "m09", "name": "Ice Latte", "price": 140}, {"cat": "Soğuk", "id": "m10", "name": "Ice Americano", "price": 120}, {"cat": "Soğuk", "id": "m11", "name": "Limonata", "price": 110}, {"cat": "Soğuk", "id": "m12", "name": "Milkshake", "price": 160}, {"cat": "Soğuk", "id": "m13", "name": "Su", "price": 25}, {"cat": "Soğuk", "id": "m14", "name": "Soda", "price": 40}, {"cat": "Soğuk", "id": "m15", "name": "Kola", "price": 70}, {"cat": "Tatlı", "id": "m16", "name": "Cheesecake", "price": 180}, {"cat": "Tatlı", "id": "m17", "name": "San Sebastian", "price": 200}, {"cat": "Tatlı", "id": "m18", "name": "Brownie", "price": 160}, {"cat": "Tatlı", "id": "m19", "name": "Waffle", "price": 220}, {"cat": "Yiyecek", "id": "m20", "name": "Kaşarlı Tost", "price": 150}, {"cat": "Yiyecek", "id": "m21", "name": "Karışık Tost", "price": 180}, {"cat": "Yiyecek", "id": "m22", "name": "Sandviç", "price": 170}]}};
const LS_KEY = "cup-adisyon-db-v1";
function memoryStore(){
  let mem = null;
  try { mem = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch(_) { mem = null; }
  if (!mem) mem = Object.assign({"config/menu": JSON.parse(JSON.stringify(DEMO_MENU)), "config/settings": {dayStartHour:0}}, JSON.parse(JSON.stringify(SEED)));
  const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(mem)); } catch(_) {} };
  save();
  const subs = [];
  const notify = () => { save(); subs.forEach(f => f()); };
  const docRef = path => ({
    async get(){ return {exists: path in mem, data: () => mem[path], id: path.split("/").pop()}; },
    async set(d){ mem[path] = JSON.parse(JSON.stringify(d)); notify(); },
    async update(d){ if(!(path in mem)) throw {code:"invalid_argument"}; deepMerge(mem[path], JSON.parse(JSON.stringify(d))); notify(); },
    async delete(){ delete mem[path]; notify(); },
    async acquire(){ return {acquired:true}; },
    onSnapshot(fn){ const f = () => fn({exists: path in mem, data: () => mem[path], id: path.split("/").pop(), metadata:{}}); subs.push(f); setTimeout(f); return () => subs.splice(subs.indexOf(f),1); },
  });
  const coll = (cpath, filters=[]) => ({
    where(f,op,v){ return coll(cpath, filters.concat([[f,op,v]])); },
    _docs(){ return Object.keys(mem).filter(k => k.startsWith(cpath+"/") && k.split("/").length === cpath.split("/").length+1)
      .filter(k => filters.every(([f,op,v]) => { const x = mem[k][f]; return op===">=" ? x>=v : op==="<=" ? x<=v : x===v; }))
      .map(k => ({id:k.split("/").pop(), exists:true, data:() => mem[k]})); },
    async get(){ const docs = this._docs(); return {docs, size:docs.length, empty:!docs.length}; },
    onSnapshot(fn){ const f = () => { const docs = this._docs(); fn({docs, size:docs.length, empty:!docs.length, metadata:{}}); }; subs.push(f); setTimeout(f); return () => subs.splice(subs.indexOf(f),1); },
  });
  return { doc: docRef, collection: p => coll(p),
    _dump: () => JSON.parse(JSON.stringify(mem)),
    _load: obj => { mem = JSON.parse(JSON.stringify(obj)); notify(); } };
}
function deepMerge(a,b){ for (const k in b){ if (b[k] && typeof b[k]==="object" && !Array.isArray(b[k]) && a[k] && typeof a[k]==="object" && !Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }

/* ---------- Table writes (coalesced, one at a time per table) ---------- */
const wt = {timers:{}, inflight:{}, dirty:new Set()};
const busy = tid => wt.dirty.has(tid) || wt.inflight[tid];
function scheduleWrite(tid){ wt.dirty.add(tid); clearTimeout(wt.timers[tid]); wt.timers[tid] = setTimeout(() => flushTable(tid), 350); }
async function flushTable(tid){
  clearTimeout(wt.timers[tid]);
  if (wt.inflight[tid]) { await wt.inflight[tid]; if (!wt.dirty.has(tid)) return; }
  if (!wt.dirty.has(tid)) return;
  wt.dirty.delete(tid);
  const t = st.tables[tid];
  const ref = st.db.doc("tables/"+tid);
  const p = (async () => {
    try {
      if (!t || !t.lines.length) await ref.delete();
      else await ref.set({lines: t.lines, openedAt: t.openedAt, updatedAt: Date.now()});
    } catch(e){ toast("Kaydedilemedi: " + (e.code||"bağlantı")); }
  })();
  wt.inflight[tid] = p; await p; wt.inflight[tid] = null;
  if (wt.dirty.has(tid)) return flushTable(tid);
}

/* ---------- Day docs (bills + expenses) ---------- */
async function writeDay(date, patch){
  const ref = st.db.doc("days/"+date);
  patch = Object.assign({date}, patch);
  try { await ref.update(patch); }
  catch(e){
    if (e.code !== "invalid_argument") throw e;
    let lease = {acquired:true};
    try { lease = await ref.acquire({holder:HOLDER, ttlMs:4000}); } catch(_) {}
    if (!lease.acquired){ await new Promise(r => setTimeout(r, 500)); return writeDay(date, patch); }
    const s = await ref.get();
    if (s.exists) await ref.update(patch);
    else await ref.set(deepMerge({date, bills:{}, exp:{}}, patch));
  }
  // refresh the derived daily summary from the stored day
  try { const s = await ref.get(); if (s.exists) await st.db.doc("summ/"+date).set(summarize(date, s.data())); } catch(_) {}
}

function summarize(date, d){
  const out = {date, rev:0, n:0, cash:0, card:0, disc:0, exp:0, expCat:{}, hours:{}, prod:[]};
  const prod = {};
  for (const b of Object.values(d?.bills||{})){
    if (b.void) continue;
    out.rev += b.total||0; out.n++; out.cash += b.cash||0; out.card += b.card||0; out.disc += b.disc||0;
    const h = new Date(b.t).getHours(); out.hours[h] = (out.hours[h]||0) + (b.total||0);
    for (const l of b.lines||[]){ const p = prod[l.n] || (prod[l.n] = [l.n,0,0]); p[1]+=l.q; p[2]+=l.q*l.p; }
  }
  for (const e of Object.values(d?.exp||{})){
    if (e.del) continue;
    out.exp += e.amt||0; out.expCat[e.cat] = (out.expCat[e.cat]||0) + (e.amt||0);
  }
  out.prod = Object.values(prod);
  return out;
}

/* ---------- Boot ---------- */
async function boot(){
  renderAll();
  let db = null;
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch(_) { db = null; }
  st.db = db || memoryStore();
  st.live = !!db;
  $("#conn").classList.toggle("off", !st.live);
  if (!st.live) $("#conn").parentElement.hidden = true;
  $("#conn").parentElement.title = st.live ? "Bağlı: tüm cihazlar aynı veriyi görüyor" : "Yerel kayıt: veriler yalnızca bu bilgisayarın tarayıcısında";

  st.db.doc("config/menu").onSnapshot(s => {
    if (s.exists) { const d = s.data(); st.menu = {cats: d.cats||[], items: d.items||[]}; }
    renderSheet(); if (st.tab==="menu") renderMenu();
  }, onDbErr);
  st.db.doc("config/settings").onSnapshot(s => {
    const prev = st.settings.dayStartHour;
    if (s.exists) st.settings = Object.assign({dayStartHour:0}, s.data());
    if (prev !== st.settings.dayStartHour) subscribeToday();
    if (st.tab==="menu") renderMenu();
  }, onDbErr);
  st.db.doc("config/lock").onSnapshot(s => { st.lock = s.exists ? s.data() : null; }, onDbErr);
  st.db.collection("tables").onSnapshot(snap => {
    const seen = new Set();
    for (const d of snap.docs){ seen.add(d.id); if (!busy(d.id)) { const v = d.data(); st.tables[d.id] = {lines: (v.lines||[]).map(l => ({...l})), openedAt: v.openedAt||Date.now()}; } }
    for (const id of Object.keys(st.tables)) if (!seen.has(id) && !busy(id)) delete st.tables[id];
    renderTables(); renderSheet(); renderHeader();
  }, onDbErr);
  subscribeToday();
  setInterval(tick, 30000);
}
function onDbErr(e){ if (e?.code==="revoked") toast("Erişim değişti. Sayfayı yenileyin."); }

let unToday = null, todayKey = null;
function subscribeToday(){
  const key = bizDate();
  if (key === todayKey && unToday) return;
  if (unToday) unToday();
  todayKey = key; st.today = null;
  unToday = st.db.doc("days/"+key).onSnapshot(s => {
    st.today = s.exists ? s.data() : null;
    renderHeader();
    if (st.tab==="reports") refreshReports(true);
    if (st.tab==="exp" && st.expDate===todayKey) renderExp();
  }, onDbErr);
}
function tick(){ subscribeToday(); renderHeader(); if (st.tab==="tables") renderTables(); renderSheetHead();
  if ((st.tab==="menu" || st.tab==="exp") && !isUnlocked() && !document.querySelector("#v-"+st.tab+" .lockbox")){ document.activeElement?.blur?.(); st.tab==="menu" ? renderMenu() : renderExp(); } }

/* ---------- Admin PIN lock ---------- */
const UNLOCK_MS = 5*60e3;
const isUnlocked = () => Date.now() < st.unlockedUntil;
const unlock = () => { st.unlockedUntil = Date.now() + UNLOCK_MS; };
const hasPin = () => !!(st.lock && st.lock.hash);
async function hashPin(pin, salt){
  const txt = salt + ":" + pin + ":cup";
  try { if (crypto && crypto.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join(""); } } catch(_) {}
  let h = 2166136261; for (let i=0;i<txt.length;i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return "f" + h.toString(16);
}
let pinFails = 0, pinBlockedUntil = 0;
const LOCK_ICON = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`;
/* opts: {sub, setup:boolean (force new PIN), onSuccess, onCancel} */
function pinPad(el, opts){
  const s = {buf:"", stage: (opts.setup || !hasPin()) ? "new" : "enter", first:"", err:""};
  const draw = shake => {
    const n = s.stage === "enter" ? (st.lock.len || 4) : 6;
    const title = s.stage === "enter" ? "Şifre gerekli" : s.stage === "new" ? (hasPin() ? "Yeni şifre belirleyin" : "Yönetici şifresi belirleyin") : "Şifreyi tekrar girin";
    const sub = s.stage === "enter" ? (opts.sub || "") : s.stage === "new" ? "4–6 haneli bir şifre seçin. Ürün, fiyat, gider ve adisyon iptali bu şifreyle açılır." : "Aynı şifreyi bir kez daha girin.";
    el.innerHTML = `<div class="lockbox${shake ? " shake" : ""}">
      <div class="lk">${LOCK_ICON}</div><h2>${title}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}
      <div class="pindots" aria-label="${s.buf.length} hane girildi">${Array.from({length:n}, (_,i) => `<i class="${i < s.buf.length ? "on" : ""}"></i>`).join("")}</div>
      <div class="pinmsg" role="alert">${esc(s.err)}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-pin="${d}">${d}</button>`).join("")}
        <button class="fn" data-pin="del" aria-label="Sil">Sil</button><button data-pin="0">0</button>
        ${s.stage === "enter" ? `<button class="fn" data-pin="${opts.onCancel ? "cancel" : "none"}">${opts.onCancel ? "Vazgeç" : ""}</button>` : `<button class="ok" data-pin="ok">Tamam</button>`}</div>
      ${s.stage !== "enter" && opts.onCancel ? `<button class="btn sm" data-pin="cancel">Vazgeç</button>` : ""}
    </div>`;
  };
  const submit = async () => {
    if (s.stage === "enter"){
      if (Date.now() < pinBlockedUntil){ s.err = `Çok fazla deneme. ${Math.ceil((pinBlockedUntil-Date.now())/1000)} sn bekleyin.`; s.buf = ""; return draw(true); }
      const h = await hashPin(s.buf, st.lock.salt);
      if (h === st.lock.hash){ pinFails = 0; unlock(); el.onclick = null; return opts.onSuccess(); }
      pinFails++; if (pinFails >= 5){ pinBlockedUntil = Date.now() + 30000; pinFails = 0; }
      s.err = "Yanlış şifre"; s.buf = ""; return draw(true);
    }
    if (s.buf.length < 4){ s.err = "En az 4 hane girin"; return draw(true); }
    if (s.stage === "new"){ s.first = s.buf; s.buf = ""; s.err = ""; s.stage = "confirm"; return draw(); }
    if (s.buf !== s.first){ s.err = "Şifreler aynı değil, baştan girin"; s.buf = ""; s.first = ""; s.stage = "new"; return draw(true); }
    const salt = uid();
    const lock = {hash: await hashPin(s.buf, salt), salt, len: s.buf.length, at: Date.now()};
    try { await st.db.doc("config/lock").set(lock); } catch(_) { s.err = "Şifre kaydedilemedi"; return draw(true); }
    st.lock = lock; unlock(); el.onclick = null; toast("Şifre kaydedildi"); opts.onSuccess();
  };
  el.onclick = e => {
    const b = e.target.closest("[data-pin]"); if (!b) return;
    const k = b.dataset.pin;
    if (k === "cancel"){ el.onclick = null; return opts.onCancel && opts.onCancel(); }
    if (k === "none") return;
    if (k === "del"){ s.buf = s.buf.slice(0,-1); s.err = ""; return draw(); }
    if (k === "ok") return submit();
    if (s.buf.length >= 6) return;
    s.buf += k; s.err = ""; draw();
    if (s.stage === "enter" && s.buf.length === (st.lock.len || 4)) submit();
  };
  draw();
}
function renderLockView(tab){
  const v = $("#v-"+tab);
  const sub = tab === "menu" ? "Menü, fiyatlar ve ayarlar şifreyle korunuyor." : "Gider ekleme ve silme şifreyle korunuyor.";
  pinPad(v, {sub, onSuccess: () => { if (tab === "menu") renderMenu(); else renderExp(); }});
}
function requirePin(fn, sub){
  if (isUnlocked()) return fn();
  showModal(`<div id="pinhost"></div>`);
  pinPad($("#pinhost"), {sub: sub || "Bu işlem için yönetici şifresi gerekiyor.", onSuccess: () => { hideModal(); fn(); }, onCancel: hideModal});
}
document.addEventListener("pointerdown", () => { if (isUnlocked() && (st.tab === "menu" || st.tab === "exp")) unlock(); }, true);

/* ---------- Tables view ---------- */
function tileHTML(t, cls=""){
  const o = st.tables[t.id]; const open = o && o.lines.length;
  const long = open && (Date.now()-o.openedAt)/60000 >= LONG_MIN;
  const c = ["tbl", cls, t.round?"round":"", open?"open":"", long?"long":""].join(" ");
  const aria = open ? `${t.name}, açık, ${tl(linesTotal(o.lines))}` : `${t.name}, boş`;
  return `<button class="${c}" data-tid="${t.id}" aria-label="${esc(aria)}"><span class="nm">${esc(t.round ? t.name.replace("Bar ","") : t.name)}</span>${open ? `<span class="amt">${tlShort(linesTotal(o.lines))}</span><span class="tm">${elapsed(o.openedAt)}</span>` : ""}</button>`;
}
const VW = 554, VH = 1255;
const isPortrait = () => window.innerHeight > window.innerWidth;
function renderTables(){
  if (drag.active){ drag.pending = true; return; }
  const v = $("#v-tables");
  const mode = st.planMode || "plan";
  const vertical = mode === "plan" && isPortrait();
  $("#main").classList.toggle("tight", vertical);
  const openN = Object.values(st.tables).filter(t => t.lines.length).length;
  const openSum = Object.values(st.tables).reduce((s,t) => s + linesTotal(t.lines), 0);
  const seg = `<div class="seg" role="group" aria-label="Görünüm"><button data-plan="plan" aria-pressed="${mode==="plan"}">Plan</button><button data-plan="list" aria-pressed="${mode==="list"}">Liste</button></div>`;
  const banner = "";
  if (vertical){
    const pct = (a,b) => (a/b*100).toFixed(3)+"%";
    v.innerHTML = `${banner}
      <div class="vrow"><div class="muted num" style="min-width:0"><b style="color:var(--ink)">${openN}</b> açık masa · ${tl(openSum)}<div style="font-size:11px">Aktarmak için masayı basılı tutup sürükleyin</div></div>${seg}</div>
      <div class="vwrap" id="vwrap"><div class="vplan" id="vplan" role="group" aria-label="Kat planı">
        ${TABLES.map(t => tileHTML(t).replace('class="tbl', `style="left:${pct(t.y,VW)};top:${pct(1255 - t.x,VH)}" class="tbl`)).join("")}
      </div></div>`;
    fitVPlan();
    return;
  }
  let body;
  if (mode === "plan"){
    const pct = (x,w) => (x/w*100).toFixed(3)+"%";
    body = `<div class="plan" role="group" aria-label="Kat planı">
      ${ZONES.map(z => `<div class="zone ${z.kind}" style="left:${pct(z.x,PW)};top:${pct(z.y,PH)};width:${pct(z.w,PW)};height:${pct(z.h,PH)}"><span>${z.name}</span></div>`).join("")}
      <div class="zone wood bar" style="left:0;top:${pct(122,PH)};width:${pct(150,PW)};height:${pct(431,PH)};background-image:none;border-right:1px dashed var(--wood-line)"><span>Bar</span></div>
      ${TABLES.map(t => tileHTML(t).replace('class="tbl', `style="left:${pct(t.x,PW)};top:${pct(t.y,PH)}" class="tbl`)).join("")}
    </div>`;
  } else {
    body = `<div class="zones">${GRID_ZONES.map(([zid,zn]) => {
      const ts = TABLES.filter(t => t.zone===zid);
      const o = ts.filter(t => st.tables[t.id]?.lines.length).length;
      return `<div><div class="ztitle"><h3>${zn}</h3><span>${o ? o+" açık" : ts.length+" masa"}</span></div><div class="zgrid">${ts.map(t => tileHTML(t)).join("")}</div></div>`;
    }).join("")}</div>`;
  }
  v.innerHTML = `${banner}
    <div class="row" style="justify-content:space-between">
      <div><h2 class="h2">Masalar</h2><div class="muted num" style="font-size:13px">${openN} açık masa · masada bekleyen ${tl(openSum)} · aktarmak için masayı basılı tutup sürükleyin</div></div>
      <div class="row">
        <div class="legend"><span><i style="background:var(--surface);border:1px solid var(--line)"></i>Boş</span><span><i style="background:var(--accent)"></i>Açık</span><span><i style="background:var(--warn)"></i>${LONG_MIN/60} saati geçti</span></div>
        ${seg}
      </div>
    </div>
    ${body}`;
}
function fitVPlan(){
  const wrap = $("#vwrap"), plan = $("#vplan"), main = $("#main"); if (!wrap || !plan) return;
  const top = wrap.getBoundingClientRect().top - main.getBoundingClientRect().top;
  const availH = main.clientHeight - top - 8;
  const availW = wrap.clientWidth;
  const h = Math.max(240, Math.min(availH, availW * VH / VW));
  plan.style.height = h + "px"; plan.style.width = (h * VW / VH) + "px";
}
$("#v-tables").addEventListener("click", e => {
  if (drag.suppress) return;
  const p = e.target.closest("[data-plan]"); if (p){ st.planMode = p.dataset.plan; renderTables(); return; }
  const b = e.target.closest("[data-tid]"); if (b) openTable(b.dataset.tid);
});
/* Long-press an open table, drag it onto another table to transfer */
const drag = {timer:null, src:null, active:false, ghost:null, x:0, y:0, over:null, suppress:false};
$("#v-tables").addEventListener("contextmenu", e => { if (e.target.closest("[data-tid]")) e.preventDefault(); });
$("#v-tables").addEventListener("pointerdown", e => {
  const t = e.target.closest("[data-tid]"); if (!t || (e.pointerType==="mouse" && e.button!==0)) return;
  const tid = t.dataset.tid; if (!st.tables[tid]?.lines.length) return;
  drag.src = tid; drag.x = e.clientX; drag.y = e.clientY;
  clearTimeout(drag.timer);
  drag.timer = setTimeout(() => startDrag(e.clientX, e.clientY), 380);
});
function startDrag(x, y){
  drag.timer = null; drag.active = true;
  try { navigator.vibrate && navigator.vibrate(25); } catch(_) {}
  const o = st.tables[drag.src];
  const g = document.createElement("div"); g.className = "drag-ghost";
  g.innerHTML = `<b>${esc(TBY[drag.src].name)}</b><span>${tl(linesTotal(o.lines))}</span>`;
  document.body.appendChild(g); drag.ghost = g;
  document.querySelector(`#v-tables [data-tid="${drag.src}"]`)?.classList.add("dragging");
  document.body.classList.add("is-dragging");
  moveGhost(x, y);
}
function moveGhost(x, y){
  if (!drag.ghost) return;
  drag.ghost.style.left = x + "px"; drag.ghost.style.top = (y - 46) + "px";
  const el = document.elementFromPoint(x, y)?.closest?.("#v-tables [data-tid]");
  const id = el && el.dataset.tid !== drag.src ? el.dataset.tid : null;
  if (id !== drag.over){
    document.querySelectorAll("#v-tables .drop").forEach(n => n.classList.remove("drop"));
    drag.over = id; if (el && id) el.classList.add("drop");
    drag.ghost.classList.toggle("on", !!id);
  }
}
function endDrag(commit){
  clearTimeout(drag.timer); drag.timer = null;
  const wasActive = drag.active, from = drag.src, to = drag.over;
  drag.active = false; drag.over = null; drag.src = null;
  drag.ghost?.remove(); drag.ghost = null;
  document.body.classList.remove("is-dragging");
  document.querySelectorAll("#v-tables .drop, #v-tables .dragging").forEach(n => n.classList.remove("drop","dragging"));
  if (wasActive){
    drag.suppress = true; setTimeout(() => drag.suppress = false, 350);
    if (drag.pending){ drag.pending = false; renderTables(); }
    if (commit && to) askTransfer(from, to);
    else if (commit) toast("Aktarmak için başka bir masanın üstüne bırakın");
  }
}
window.addEventListener("pointermove", e => {
  if (drag.timer && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 10){ clearTimeout(drag.timer); drag.timer = null; drag.src = null; }
  if (drag.active){ e.preventDefault(); moveGhost(e.clientX, e.clientY); }
}, {passive:false});
window.addEventListener("pointerup", () => endDrag(true));
window.addEventListener("pointercancel", () => endDrag(false));
document.addEventListener("touchmove", e => { if (drag.active) e.preventDefault(); }, {passive:false});
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (st.tab==="tables") renderTables(); }, 150); });

function cats(){ const c = [...st.menu.cats]; for (const i of st.menu.items) if (!c.includes(i.cat)) c.push(i.cat); return c; }
function renderChips(){

function renderLines(){

function mutateTable(tid, fn){
  const o = st.tables[tid] || (st.tables[tid] = {lines:[], openedAt: Date.now()});
  if (!o.lines.length) o.openedAt = Date.now();

  if (!o.lines.length) delete st.tables[tid];

}
$("#sheet").addEventListener("click", e => {

  if (a==="clear") return confirmBox("Masayı boşalt?", `${TBY[tid].name} adisyonundaki tüm ürünler silinecek. Satış olarak kaydedilmez.`, "Boşalt", () => mutateTable(tid, o => o.lines = []));

  const p = e.target.closest("[data-pid]");

  const inc = e.target.closest("[data-inc]"); if (inc){ mutateTable(tid, o => o.lines[+inc.dataset.inc].qty++); return; }

/* ---------- Modals ---------- */
function showModal(html, onClick){
  const m = $("#modal"); m.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false;
  m.onclick = e => { if (e.target === m || e.target.closest("[data-x]")) return hideModal(); onClick && onClick(e); };
  setTimeout(() => m.querySelector("input,button")?.focus(), 30);
}
function hideModal(){ $("#modal").hidden = true; $("#modal").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key==="Escape"){ if (!$("#modal").hidden) hideModal(); else if (!$("#sheet").hidden) closeSheet(); } });
function confirmBox(title, text, okLabel, onOk){
  showModal(`<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Vazgeç</button><button class="btn danger" data-ok>${esc(okLabel)}</button></div>`,
    e => { if (e.target.closest("[data-ok]")){ hideModal(); onOk(); } });
}

/* Payment */
function openPay(tid){
  const o = st.tables[tid]; if (!o || !o.lines.length) return;
  const sub = linesTotal(o.lines);
  const ps = {method:"cash", discType:"tl", disc:0, given:"", cardPart:""};
  const calc = () => {
    let d = Math.max(0, +ps.disc||0); if (ps.discType==="pct") d = sub*Math.min(d,100)/100; d = Math.min(d, sub);
    const total = Math.round((sub-d)*100)/100;
    let cash=0, card=0;
    if (ps.method==="cash") cash = total; else if (ps.method==="card") card = total;
    else { card = Math.min(total, Math.max(0, +ps.cardPart||0)); cash = Math.round((total-card)*100)/100; }
    return {d, total, cash, card};
  };
  const draw = () => {
    const c = calc(); const given = +ps.given||0;
    showModal(`
      <h2>${esc(TBY[tid].name)} · Hesap</h2>
      <div class="list" style="max-height:180px;overflow-y:auto">${o.lines.map(l => `<div class="li"><span class="grow">${l.qty} × ${esc(l.name)}</span><span class="r">${tl(l.qty*l.price)}</span></div>`).join("")}</div>
      <div class="sumrow"><span class="muted">Ara toplam</span><span>${tl(sub)}</span></div>
      <div class="row" style="flex-wrap:nowrap">
        <div class="field" style="flex:1"><label for="pay-disc">İndirim</label><input class="inp num" id="pay-disc" inputmode="decimal" value="${ps.disc||""}" placeholder="0"></div>
        <div class="seg" style="align-self:flex-end"><button data-dt="tl" aria-pressed="${ps.discType==="tl"}">₺</button><button data-dt="pct" aria-pressed="${ps.discType==="pct"}">%</button></div>
      </div>
      ${c.d ? `<div class="sumrow"><span class="muted">İndirim</span><span>−${tl(c.d)}</span></div>` : ""}
      <div class="sumrow big"><span>Ödenecek</span><span>${tl(c.total)}</span></div>
      <div class="methods" role="group" aria-label="Ödeme yöntemi"><button data-m="cash" aria-pressed="${ps.method==="cash"}">Nakit</button><button data-m="card" aria-pressed="${ps.method==="card"}">Kart</button><button data-m="mix" aria-pressed="${ps.method==="mix"}">Nakit + Kart</button></div>
      ${ps.method==="mix" ? `<div class="field"><label for="pay-card">Karttan çekilen</label><input class="inp num" id="pay-card" inputmode="decimal" value="${ps.cardPart}" placeholder="0"></div><div class="sumrow"><span class="muted">Nakit kalan</span><span>${tl(c.cash)}</span></div>` : ""}
      ${ps.method!=="card" && c.cash>0 ? `<div class="field"><label for="pay-given">Müşteriden alınan nakit</label><input class="inp num" id="pay-given" inputmode="decimal" value="${ps.given}" placeholder="${c.cash}"></div>
        <div class="quick">${[...new Set([c.cash, Math.ceil(c.cash/50)*50, Math.ceil(c.cash/100)*100, Math.ceil(c.cash/200)*200, 500, 1000])].filter(v => v>=c.cash).slice(0,5).map(v => `<button class="btn sm" data-give="${v}">${tl(v)}</button>`).join("")}</div>
        ${given>=c.cash && given>0 ? `<div class="sumrow big" style="color:var(--good)"><span>Para üstü</span><span>${tl(given-c.cash)}</span></div>` : ""}` : ""}
      <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Vazgeç</button><button class="btn good" data-close>Ödendi, masayı kapat</button></div>`,
      async e => {
        const m = e.target.closest("[data-m]"); if (m){ ps.method = m.dataset.m; return draw(); }
        const dt = e.target.closest("[data-dt]"); if (dt){ ps.discType = dt.dataset.dt; return draw(); }
        const g = e.target.closest("[data-give]"); if (g){ ps.given = g.dataset.give; return draw(); }
        if (e.target.closest("[data-close]")){ e.target.closest("[data-close]").disabled = true; await closeBill(tid, sub, calc()); }
      });
    const bind = (id, key) => { const inp = $("#"+id); if (!inp) return; inp.addEventListener("change", () => { ps[key] = inp.value.replace(",", "."); draw(); }); };
    bind("pay-disc","disc"); bind("pay-card","cardPart"); bind("pay-given","given");
  };
  draw();
}
async function closeBill(tid, sub, c){
  const o = st.tables[tid]; if (!o) return hideModal();
  const now = Date.now(), date = bizDate(now), id = uid();
  const bill = {t: now, opened: o.openedAt, table: tid, lines: o.lines.map(l => ({n:l.name, p:l.price, q:l.qty})), sub, disc: Math.round(c.d*100)/100, total: c.total, cash: c.cash, card: c.card};
  try {
    await writeDay(date, {bills: {[id]: bill}});
  } catch(e){ toast("Hesap kaydedilemedi, tekrar deneyin."); hideModal(); return; }
  delete st.tables[tid]; wt.dirty.add(tid); await flushTable(tid);
  hideModal(); closeSheet(); renderHeader();
  toast(`${TBY[tid].name} kapandı · ${tl(c.total)}`);
}

/* Move table */
function openMove(tid){
  const src = st.tables[tid]; if (!src) return;
  showModal(`<h2>${esc(TBY[tid].name)} → hangi masa?</h2><p class="muted" style="margin:0;font-size:13px">Açık bir masa seçerseniz iki adisyon birleşir.</p>
    ${GRID_ZONES.map(([zid,zn]) => `<div><div class="muted" style="font-size:12px;font-weight:700;margin-bottom:4px">${zn}</div><div class="tpick">${TABLES.filter(t => t.zone===zid && t.id!==tid).map(t => `<button data-to="${t.id}" class="${st.tables[t.id]?.lines.length ? "open":""}">${esc(t.name)}</button>`).join("")}</div></div>`).join("")}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Vazgeç</button></div>`,
    e => { const b = e.target.closest("[data-to]"); if (!b) return;
      const to = b.dataset.to; transferTable(tid, to);
      hideModal(); st.openTid = to; renderSheet(true);
    });
}
function transferTable(from, to){
  const src = st.tables[from]; if (!src || from === to) return;
  const dst = st.tables[to] || (st.tables[to] = {lines:[], openedAt: src.openedAt});
  for (const l of src.lines){ const x = dst.lines.find(d => d.id===l.id && d.price===l.price); if (x) x.qty += l.qty; else dst.lines.push({...l}); }
  dst.openedAt = Math.min(dst.openedAt, src.openedAt);
  delete st.tables[from]; scheduleWrite(from); scheduleWrite(to);
  renderHeader(); if (st.tab==="tables") renderTables();
  toast(`${TBY[from].name} → ${TBY[to].name} aktarıldı`);
}
function askTransfer(from, to){
  const src = st.tables[from]; if (!src) return;
  const dst = st.tables[to]; const merge = dst && dst.lines.length;
  showModal(`<h2>Masa aktarılsın mı?</h2>
    <div class="row" style="justify-content:center;gap:14px;font-family:var(--f-brand);font-size:26px;font-weight:600"><span>${esc(TBY[from].name)}</span><span class="muted">→</span><span>${esc(TBY[to].name)}</span></div>
    <p class="muted" style="margin:0">${esc(TBY[from].name)} masasındaki ${linesCount(src.lines)} ürün (${tl(linesTotal(src.lines))}) ${esc(TBY[to].name)} masasına aktarılacak.${merge ? ` ${esc(TBY[to].name)} masası da açık (${tl(linesTotal(dst.lines))}); iki adisyon birleşecek.` : ""}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Vazgeç</button><button class="btn primary" data-ok>${merge ? "Birleştir" : "Aktar"}</button></div>`,
    e => { if (e.target.closest("[data-ok]")){ hideModal(); transferTable(from, to); } });
}

/* ---------- Reports ---------- */
function range(mode, anchor){
  const a = parseYmd(anchor);
  if (mode==="day") return [anchor, anchor];
  if (mode==="week"){ const dow = (a.getDay()+6)%7; const s = addDays(a,-dow); return [ymd(s), ymd(addDays(s,6))]; }
  if (mode==="month") return [ymd(new Date(a.getFullYear(), a.getMonth(), 1)), ymd(new Date(a.getFullYear(), a.getMonth()+1, 0))];
  return [`${a.getFullYear()}-01-01`, `${a.getFullYear()}-12-31`];
}
function shift(mode, anchor, dir){
  const a = parseYmd(anchor);
  if (mode==="day") return ymd(addDays(a, dir));
  if (mode==="week") return ymd(addDays(a, 7*dir));
  if (mode==="month") return ymd(new Date(a.getFullYear(), a.getMonth()+dir, 1));
  return ymd(new Date(a.getFullYear()+dir, 0, 1));
}
function rangeLabel(mode, anchor){
  const [s,e] = range(mode, anchor); const a = parseYmd(s), b = parseYmd(e);
  if (mode==="day") return longDate(a);
  if (mode==="week") return `${a.getDate()} ${MSHORT[a.getMonth()]} – ${b.getDate()} ${MSHORT[b.getMonth()]} ${b.getFullYear()}`;
  if (mode==="month") return `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  return `${a.getFullYear()}`;
}
let repUnsub = null, repDayDoc = null, repSumms = [], repLoading = false, repKey = "";
async function refreshReports(fromToday){
  if (!st.rep.anchor) st.rep.anchor = bizDate();
  const {mode, anchor} = st.rep;
  const [s,e] = range(mode, anchor);
  const key = mode+"|"+s;
  if (fromToday && key === repKey) return renderReports();
  if (key !== repKey){
    repKey = key; repSumms = []; repDayDoc = null;
    if (repUnsub){ repUnsub(); repUnsub = null; }
    if (mode==="day"){
      if (s !== todayKey){
        repLoading = true;
        repUnsub = st.db.doc("days/"+s).onSnapshot(snap => { repLoading = false; repDayDoc = snap.exists ? snap.data() : null; if (st.tab==="reports") renderReports(); }, onDbErr);
      }
    } else {
      repLoading = true; renderReports();
      try { const q = await st.db.collection("summ").where("date",">=",s).where("date","<=",e).get(); if (repKey !== key) return; repSumms = q.docs.map(d => d.data()); }
      catch(err){ toast("Rapor yüklenemedi."); }
      repLoading = false;
    }
  }
  renderReports();
}
function reportData(){
  const {mode, anchor} = st.rep; const [s,e] = range(mode, anchor);
  let summs;
  if (mode==="day") summs = [summarize(s, s===todayKey ? st.today : repDayDoc)];
  else { summs = repSumms.filter(x => x.date !== todayKey); if (todayKey >= s && todayKey <= e) summs.push(summarize(todayKey, st.today)); }
  const T = {rev:0,n:0,cash:0,card:0,disc:0,exp:0,expCat:{},prod:{}};
  for (const x of summs){ T.rev+=x.rev; T.n+=x.n; T.cash+=x.cash; T.card+=x.card; T.disc+=x.disc; T.exp+=x.exp;
    for (const k in x.expCat) T.expCat[k]=(T.expCat[k]||0)+x.expCat[k];
    for (const [n,q,r] of x.prod||[]){ const p = T.prod[n]||(T.prod[n]={n,q:0,r:0}); p.q+=q; p.r+=r; } }
  // buckets
  let buckets = [];
  if (mode==="day"){
    const x = summs[0]; const h0 = st.settings.dayStartHour||0;
    const hrs = Object.keys(x.hours).map(Number);
    const order = Array.from({length:24}, (_,i) => (h0+i)%24);
    let first = order.findIndex(h => x.hours[h]), last = 23 - [...order].reverse().findIndex(h => x.hours[h]);
    if (!hrs.length){ first = order.indexOf(9); last = order.indexOf(23); if (first<0||last<first){ first=0; last=14; } }
    first = Math.max(0, Math.min(first, order.indexOf(9) >= 0 ? order.indexOf(9) : first));
    for (let i=first;i<=last;i++){ const h = order[i]; buckets.push({label: pad(h), rev: x.hours[h]||0, exp: 0}); }
  } else if (mode==="year"){
    buckets = MSHORT.map(m => ({label:m, rev:0, exp:0}));
    for (const x of summs){ const m = +x.date.slice(5,7)-1; buckets[m].rev += x.rev; buckets[m].exp += x.exp; }
  } else {
    const by = Object.fromEntries(summs.map(x => [x.date, x]));
    for (let d = parseYmd(s); ymd(d) <= e; d = addDays(d,1)){ const k = ymd(d), x = by[k];
      buckets.push({label: mode==="week" ? DAYS[d.getDay()] : String(d.getDate()), rev: x?.rev||0, exp: x?.exp||0, future: k > todayKey}); }
  }
  return {T, buckets, summs};
}
function chartSVG(buckets, showExp){
  const W = 760, H = 240, L = 54, R = 10, Tp = 12, B = 26;
  const max = Math.max(1, ...buckets.map(b => Math.max(b.rev, showExp ? b.exp : 0)));
  const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const iw = W-L-R, ih = H-Tp-B, n = buckets.length, bw = iw/n;
  const y = v => Tp + ih - v/top*ih;
  let g = "";
  for (let v=0; v<=top+1e-9; v+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${axisTL(v)}</text>`; }
  const every = n > 16 ? Math.ceil(n/12) : 1;
  buckets.forEach((b,i) => {
    const x0 = L + i*bw; const gap = Math.min(6, bw*.18); const inner = bw - gap*2;
    const w1 = showExp ? inner/2 : inner;
    if (b.rev>0) g += `<rect x="${x0+gap}" y="${y(b.rev)}" width="${Math.max(1,w1-1)}" height="${ih-(y(b.rev)-Tp)}" rx="2" fill="var(--accent)"><title>${esc(b.label)}: gelir ${tl(b.rev)}</title></rect>`;
    if (showExp && b.exp>0) g += `<rect x="${x0+gap+w1}" y="${y(b.exp)}" width="${Math.max(1,w1-1)}" height="${ih-(y(b.exp)-Tp)}" rx="2" fill="var(--bad)" opacity=".8"><title>${esc(b.label)}: gider ${tl(b.exp)}</title></rect>`;
    if (i % every === 0) g += `<text x="${x0+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${b.future ? "var(--line)" : "var(--muted)"}">${esc(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="min-width:${n>16?560:0}px" role="img" aria-label="Gelir grafiği">${g}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const f = x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function axisTL(v){ return v>=1000 ? "₺"+(v/1000).toLocaleString("tr-TR",{maximumFractionDigits:1})+"B" : "₺"+v; }

    <datalist id="catlist">${cs.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    ${cs.length ? cs.map(c => `<div class="card"><h3>${esc(c)}</h3>${st.menu.items.filter(i => i.cat===c).map(i => `
      <div class="menu-row" data-id="${esc(i.id)}">
        <input class="inp" id="mn-${esc(i.id)}" data-f="name" value="${esc(i.name)}" aria-label="Ürün adı">
        <input class="inp catsel" id="mc-${esc(i.id)}" data-f="cat" list="catlist" value="${esc(i.cat)}" aria-label="Kategori">
        <input class="inp num" id="mp-${esc(i.id)}" data-f="price" inputmode="decimal" value="${i.price}" aria-label="Fiyat (₺)">
        <button class="icon-btn" data-del aria-label="${esc(i.name)} sil">×</button>
      </div>`).join("")}</div>`).join("") : `<div class="card empty">Menüde ürün yok. “Ürün ekle” ile başlayın.</div>`}
    <div class="card">
      <h3>Gün dönümü</h3>
      <div class="row"><label for="dsh" class="grow" style="min-width:200px">Gece yarısından sonra kapanan hesaplar hangi saate kadar önceki güne yazılsın?</label>
      <select class="inp" id="dsh" style="width:auto">${[0,1,2,3,4,5,6].map(h => `<option value="${h}" ${st.settings.dayStartHour===h?"selected":""}>${h===0 ? "Gece 00:00 (kapalı)" : pad(h)+":00"}</option>`).join("")}</select></div>
    </div>
    <div class="card">
      <h3>Yönetici şifresi</h3>
      <p class="muted" style="margin:0 0 10px;font-size:14px">Menü, Giderler ve adisyon iptali bu şifreyle açılır. Açıldıktan sonra 5 dakika işlem yapılmazsa ya da Masalar'a geçilince yeniden kilitlenir.</p>
      <button class="btn" data-chpin>Şifreyi değiştir</button>
    </div>
    ${st.db._dump ? `<div class="card">
      <h3>Yedek</h3>
      <p class="muted" style="margin:0 0 10px;font-size:14px">Tüm satışlar, giderler ve menü bu iPad'de saklanıyor. Haftada bir yedek alıp Dosyalar'a veya iCloud Drive'a kaydedin.</p>
      <div class="row"><button class="btn primary" data-backup>Yedek al</button>
      <label class="btn" for="restore-file" style="cursor:pointer">Yedekten geri yükle</label>
      <input type="file" id="restore-file" accept=".json,application/json" hidden></div>
    </div>` : ""}`;
}
/* Add product: step 1 pick an existing list or name a new one, step 2 product name + price */
function openAddProduct(){
  const st2 = {step: "list", cat: null, isNew: false};
  const norm = x => x.trim().toLocaleLowerCase("tr");
  const drawList = () => {
    const cs = cats();
    showModal(`
      <h2>Ürün ekle</h2>
      <p class="muted" style="margin:0">Ürün hangi listeye eklensin?</p>
      ${cs.length ? `<div class="field"><label>Mevcut listeye ekle</label>
        <div class="tpick" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${cs.map(c => `<button data-pickcat="${esc(c)}">${esc(c)} <span class="muted num" style="font-weight:500">· ${st.menu.items.filter(i => i.cat===c).length}</span></button>`).join("")}</div></div>` : ""}
      <form id="newcat-form" class="field" autocomplete="off">
        <label for="newcat">Yeni liste oluştur</label>
        <div class="row" style="flex-wrap:nowrap"><input class="inp" id="newcat" placeholder="Liste adı, örn. Kokteyller" maxlength="40"><button class="btn primary" type="submit" style="flex:0 0 auto">Oluştur</button></div>
        <div class="pinmsg" id="newcat-msg" style="text-align:left"></div>
      </form>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Vazgeç</button></div>`,
      e => { const b = e.target.closest("[data-pickcat]"); if (b){ st2.cat = b.dataset.pickcat; st2.isNew = false; drawItem(); } });
    $("#newcat-form").addEventListener("input", () => { $("#newcat-msg").textContent = ""; });
    $("#newcat-form").addEventListener("submit", e => {
      e.preventDefault();
      const v = $("#newcat").value.trim().replace(/\s+/g, " ");
      if (!v){ $("#newcat-msg").textContent = "Liste adını yazın"; $("#newcat").focus(); return; }
      const ex = cats().find(c => norm(c) === norm(v));
      st2.cat = ex || v; st2.isNew = !ex; drawItem();
    });
  };
  const drawItem = () => {
    showModal(`
      <h2>${esc(st2.cat)}</h2>
      <p class="muted" style="margin:0">${st2.isNew ? "Yeni liste. İlk ürününü ekleyin." : "Bu listeye yeni ürün ekleniyor."}</p>
      <form id="newitem-form" class="form" autocomplete="off" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
        <div class="field"><label for="ni-name">Ürün adı</label><input class="inp" id="ni-name" maxlength="60" placeholder="Örn. Mojito"></div>
        <div class="field"><label for="ni-price">Fiyat (₺)</label><input class="inp num" id="ni-price" inputmode="decimal" placeholder="0"></div>
        <div class="pinmsg" id="ni-msg" style="grid-column:1/-1;text-align:left"></div>
        <div class="row" style="grid-column:1/-1;justify-content:space-between">
          <button class="btn" type="button" data-back>← Liste seç</button>
          <div class="row"><button class="btn" type="button" data-addmore>Ekle, bir tane daha</button><button class="btn primary" type="submit">Ekle</button></div>
        </div>
      </form>`,
      e => { if (e.target.closest("[data-back]")) drawList(); if (e.target.closest("[data-addmore]")) save(true); });
    const save = more => {
      const name = $("#ni-name").value.trim().replace(/\s+/g, " ");
      const price = parseFloat(($("#ni-price").value || "").replace(",", "."));
      if (!name){ $("#ni-msg").textContent = "Ürün adını yazın"; $("#ni-name").focus(); return; }
      if (!(price >= 0) || $("#ni-price").value.trim() === ""){ $("#ni-msg").textContent = "Fiyatı yazın"; $("#ni-price").focus(); return; }
      if (st.menu.items.some(i => i.cat === st2.cat && norm(i.name) === norm(name))){ $("#ni-msg").textContent = "Bu listede aynı adlı ürün zaten var"; return; }
      st.menu.items.push({id: uid(), name, cat: st2.cat, price});
      if (st2.isNew && !st.menu.cats.includes(st2.cat)) st.menu.cats.push(st2.cat);
      saveMenu(); toast(`${name} · ${tl(price)} → ${st2.cat}`);
      if (more){ st2.isNew = false; drawItem(); }
      else { hideModal(); renderMenu(); }
    };
    $("#newitem-form").addEventListener("submit", e => { e.preventDefault(); save(false); });
    $("#newitem-form").addEventListener("input", () => { $("#ni-msg").textContent = ""; });
    setTimeout(() => $("#ni-name")?.focus(), 40);
  };
  drawList();
}
$("#v-menu").addEventListener("change", e => {
  if (e.target.id === "dsh"){ const h = +e.target.value; st.settings.dayStartHour = h; st.db.doc("config/settings").set({dayStartHour:h}).then(() => toast("Gün dönümü kaydedildi")).catch(() => toast("Kaydedilemedi.")); return; }
  const row = e.target.closest(".menu-row"); if (!row) return;
  const it = st.menu.items.find(i => i.id===row.dataset.id); if (!it) return;
  const f = e.target.dataset.f; let val = e.target.value.trim();
  if (f==="price"){ val = parseFloat(val.replace(",", ".")); if (!(val>=0)) { toast("Geçerli bir fiyat girin."); return; } }
  if (f!=="price" && !val) { toast("Boş bırakılamaz."); return; }
  it[f] = val; saveMenu().then(() => { if (f==="cat") { document.activeElement?.blur(); renderMenu(); } });
});
async function doBackup(){
  const data = {app:"cup-adisyon", version:1, savedAt:new Date().toISOString(), docs: st.db._dump()};
  const name = `cup-yedek-${ymd(new Date())}.json`;
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  try {
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); toast("Yedek hazır"); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast("Yedek indirildi");
}
$("#v-menu").addEventListener("change", e => {
  if (e.target.id !== "restore-file" || !e.target.files[0]) return;
  const f = e.target.files[0]; e.target.value = "";
  f.text().then(txt => {
    let data; try { data = JSON.parse(txt); } catch(_) { toast("Bu dosya okunamadı."); return; }
    let docs = data && data.app === "cup-adisyon" ? data.docs : null;
    if (!docs || typeof docs !== "object") { toast("Bu bir C'up yedeği değil."); return; }
    const days = Object.keys(docs).filter(k => k.startsWith("days/")).length;
    confirmBox("Yedek geri yüklensin mi?", `${days} günlük kayıt yüklenecek. Bu iPad'deki mevcut veriler yedektekiyle değiştirilecek.`, "Geri yükle", () => {
      const cur = st.db._dump()["config/lock"]; docs = Object.assign({}, docs); if (cur) docs["config/lock"] = cur; else delete docs["config/lock"];
      st.tables = {}; st.db._load(docs); repKey = ""; toast("Yedek geri yüklendi");
      setTimeout(() => location.reload(), 600);
    });
  });
}, true);
$("#v-menu").addEventListener("click", e => {
  if (e.target.closest("[data-backup]")) { doBackup(); return; }
  if (e.target.closest("[data-chpin]")) { showModal(`<div id="pinhost"></div>`); pinPad($("#pinhost"), {setup:true, onSuccess: () => { hideModal(); renderMenu(); }, onCancel: hideModal}); return; }
  if (e.target.closest("[data-add]")){ openAddProduct(); return; }
  const d = e.target.closest("[data-del]");
  if (d){ const id = d.closest(".menu-row").dataset.id; const it = st.menu.items.find(i => i.id===id);
    confirmBox("Ürün silinsin mi?", `${it?.name||""} menüden kaldırılacak. Geçmiş satış raporları etkilenmez.`, "Sil", () => { st.menu.items = st.menu.items.filter(i => i.id!==id); saveMenu(); renderMenu(); }); }
});

boot();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(_) {}
})();
</script>
